# X-Men Legends (World) — per-title recompiler config.
#
# includes  `xmen-legends-functions.toml` � 27,673 functions with authoritative
#           start/end from the disassembler; supersedes fnptrscan for this title.
# manual_file  per-title recomp_manual.c (hand-written overrides).
# manual_functions  addrs the emitter must NOT emit � recomp_manual.c defines them.
# seeds  the few entry points nothing references even from data (CRT thread start).


manual_file = "configs/xmen-legends-manual.c"

includes = ["xmen-legends-functions.toml"]

seeds = [
  # CRT / thread startup. 0x342BFC / 0x342B3C look like bare epilogues but are
  # real indirect-dispatch targets (MSVC C++ EH catch funclets that unwind the
  # enclosing frame): removing them stalls the heap allocator at ~100 calls.
  0x1A3639, 0x1A23F3, 0x1A35AC, 0x1A3554, 0x11E40,
  0x342B3C, 0x343862, 0x346743, 0x342BFC,

  # engine helpers seen as unresolved indirect targets
  0x1E9380, 0x374A4B, 0x374A56, 0x37207A,
  0x340CDE, 0x340D86,

  # static-init ctors / thunks the analysis missed — reached only through
  # _initterm tables, flagged by the boot smoke loop as "unimplemented
  # indirect target". Without them the Alchemy subsystem registry
  # ([0x5bbab4], [0x5bb700]) is never populated and sub_00216210 null-calls.
  0x0C5A10, 0x3556E0, 0x3587F0,
]
